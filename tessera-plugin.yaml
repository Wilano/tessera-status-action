# The manifest: who made the plugin, what it may do, and what the Tessera app shows. It holds no code and no words:
# every name, label and hint below is a key into translations/<language>.json, part "app". Every field: docs/MANIFEST.md.
id: status_action
version: 0.2.0
# Entity options a person chooses per tile (0.15): the entity whose state the tile shows, and the one its tap acts on.
api: "0.15"
icon: gesture-tap-button
maintainer: Wilano
license: MIT
stage: beta
topics: [home]
requires:
  esphome: 2026.6.2
boards: any
flash_kb: 5

permissions:
  # The tap runs one of these on the target entity (its id travels in the action's fields, so the entity may be a
  # script, a scene or a button that Tessera draws no tile for).
  home_assistant_actions: [homeassistant.toggle, homeassistant.turn_on, homeassistant.turn_off, button.press]

tiles:
  - id: control
    name: tile_name
    icon: gesture-tap-button
    sizes: { min: 1x1, max: 2x2 }
    memory: 600
    example: tile_example
    options:
      # What the tile shows: any entity with a state worth reading.
      - { id: status, kind: entity, domains: [alarm_control_panel, binary_sensor, sensor, switch, light, lock, cover, input_boolean], attributes: [unit_of_measurement, device_class], label: opt_status, hint: opt_status_hint }
      # What a tap acts on: a second, different entity. A script, a scene or a button is reached too.
      - { id: target, kind: entity, domains: [script, switch, input_boolean, light, scene, button, automation, fan], label: opt_target, hint: opt_target_hint }
      - id: action
        kind: choice
        label: opt_action
        hint: opt_action_hint
        default: toggle
        choices:
          - { value: toggle, label: act_toggle }
          - { value: turn_on, label: act_turn_on }
          - { value: turn_off, label: act_turn_off }
          - { value: press, label: act_press }
      # A guard for a target that matters (an alarm): the first tap asks, the second acts.
      - { id: confirm, kind: toggle, default: false, label: opt_confirm, hint: opt_confirm_hint }
      # The language of the "tap again" prompt, for a screen used in German.
      - id: confirm_lang
        kind: choice
        label: opt_confirm_lang
        hint: opt_confirm_lang_hint
        default: en
        choices:
          - { value: en, label: lang_en }
          - { value: de, label: lang_de }
      # How big the state word is: the biggest that fits (large), or one step down (small).
      - id: text_size
        kind: choice
        label: opt_text_size
        hint: opt_text_size_hint
        default: large
        choices:
          - { value: large, label: size_large }
          - { value: small, label: size_small }
      # The target's name under the state. Off gives the whole tile to the state.
      - { id: show_action, kind: toggle, default: true, label: opt_show_action, hint: opt_show_action_hint }
